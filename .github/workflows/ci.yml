name: ci

# Lint, a headless import and boot (every script must parse), the greps, the
# GUT suite, the save guard, the session recorder's unit tests, the autodrive
# bot playing every mode headless (asserts only: the frame gate needs a
# display and stays local in scripts/autodrive_all.sh), the audio build and
# its gate, the 100 % Python coverage gate, the Linux export, the round
# builder and the Web build in a headless Chrome (scripts/test_web.sh). The
# shared gates (file length, markdown naming, dependency freshness, repo
# contract) have their own workflows. Locally the same gates run in groups
# under 60 s: scripts/check.sh --group fast|play|bots|tools|sim|build|web|handoff.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }

      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          rm godot.zip

      # The Web smoke and the exports need the export templates (a large
      # download install.sh makes only when they are missing).
      - name: Cache the Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ env.GODOT_VERSION }}

      - name: Install project tooling, GUT, the audio build and the web venv
        run: ./install.sh

      - name: Lint (gdlint, gdformat, shellcheck, ruff)
        run: scripts/lint.sh

      - name: Headless import and boot, no SCRIPT ERROR, no exit leak
        run: scripts/check.sh smoke static

      - name: GUT
        run: scripts/test.sh

      - name: Save guard without the hook redirect
        run: scripts/test_save_guard.sh

      - name: Session recorder unit tests
        run: scripts/test_recording.sh

      - name: Autodrive bot, all three modes, headless
        run: BOT_HEADLESS=1 scripts/autodrive_all.sh

      - name: The sim's pinned balance checks
        run: scripts/balance_gate.sh

      - name: Every buff seen and heard on the battle screen, headless
        run: BOT_HEADLESS=1 scripts/test_buffs.sh

      - name: Hand-off scripts, the answer file and every item with --check, headless
        run: BOT_HEADLESS=1 scripts/test_handoff.sh

      - name: Audio tool tests, rendered files, offline analysis, boot probe
        run: tools/audio/check.sh

      - name: Python coverage, 100 percent branch
        run: scripts/coverage.sh

      - name: Linux export plays without src/dev, and the round builder
        run: |
          scripts/check.sh export
          scripts/check.sh round

      - name: Web build in an isolated headless Chrome (hub, touch to a battle, audio)
        run: scripts/test_web.sh
